<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Footer Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100">
    <div class="container mx-auto p-8">
        <h1 class="text-2xl font-bold mb-8">Footer UI Test</h1>
        
        <!-- Footer Items Management Section -->
        <div class="bg-white rounded-lg shadow-lg p-6 mb-8">
            <h2 class="text-lg font-semibold mb-4">Footer Items Management</h2>
            
            <div class="flex items-center justify-between mb-4">
                <label class="block text-sm font-medium text-gray-700">
                    Footer Tekst Onderdelen
                </label>
                <button type="button" id="addFooterItem" 
                        class="inline-flex items-center px-3 py-1.5 border border-transparent text-xs font-medium rounded-md text-white bg-green-600 hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-green-500">
                    <i class="fas fa-plus mr-1"></i>
                    Voeg Item Toe
                </button>
            </div>
            
            <!-- Footer Items Container -->
            <div id="footerItemsContainer" class="space-y-3 mb-4">
                <!-- Dynamic footer items will be added here -->
            </div>
            
            <!-- Empty State -->
            <div id="footerItemsEmpty" class="text-center py-8 border-2 border-dashed border-gray-300 rounded-lg">
                <i class="fas fa-text-width text-4xl text-gray-400 mb-3"></i>
                <p class="text-gray-500">Geen footer items</p>
                <p class="text-sm text-gray-400">Klik op "Voeg Item Toe" om te beginnen</p>
            </div>
            
            <p class="mt-2 text-sm text-gray-500">
                Items worden automatisch gescheiden door kroon-iconen. Sleep items om volgorde te wijzigen.
            </p>
        </div>
        
        <!-- Footer Settings Section -->
        <div class="bg-white rounded-lg shadow-lg p-6 mb-8">
            <h2 class="text-lg font-semibold mb-4">Footer Settings</h2>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Text Color</label>
                    <input type="color" id="footerTextColor" value="#ffffff" class="w-full h-10 rounded border">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Background Color</label>
                    <input type="color" id="footerBackgroundColor" value="#000000" class="w-full h-10 rounded border">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Font Size</label>
                    <input type="number" id="footerFontSize" value="32" class="w-full px-3 py-2 border border-gray-300 rounded">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Scroll Speed</label>
                    <input type="number" id="footerScrollSpeed" value="50" class="w-full px-3 py-2 border border-gray-300 rounded">
                </div>
            </div>
            
            <button type="button" id="saveFooterSettings" 
                    class="mt-4 px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">
                Save Footer Settings
            </button>
        </div>
        
        <!-- Preview Section -->
        <div class="bg-white rounded-lg shadow-lg p-6">
            <h2 class="text-lg font-semibold mb-4">Live Preview</h2>
            <div id="footerPreview" class="border-2 border-gray-300 rounded-lg p-4 min-h-16 bg-black text-white flex items-center justify-center">
                <span class="text-sm">Footer preview will appear here</span>
            </div>
        </div>
    </div>

    <script>
        // Simple AdminManager-like class for testing
        class FooterTestManager {
            constructor() {
                this.footerItems = [];
                this.itemIndex = 0;
            }

            init() {
                this.setupEventListeners();
                this.updateFooterPreview();
            }

            setupEventListeners() {
                console.log('Setting up event listeners...');
                
                const addFooterItemBtn = document.getElementById('addFooterItem');
                if (addFooterItemBtn) {
                    console.log('Found addFooterItem button:', addFooterItemBtn);
                    addFooterItemBtn.addEventListener('click', (e) => {
                        console.log('addFooterItem button clicked!', e);
                        this.addFooterItem();
                    });
                    console.log('Event listener added for addFooterItem button');
                } else {
                    console.error('addFooterItem button NOT FOUND');
                }

                // Settings change listeners
                const settingsInputs = ['footerTextColor', 'footerBackgroundColor', 'footerFontSize', 'footerScrollSpeed'];
                settingsInputs.forEach(inputId => {
                    const input = document.getElementById(inputId);
                    if (input) {
                        input.addEventListener('input', () => {
                            this.updateFooterPreview();
                        });
                        input.addEventListener('change', () => {
                            this.updateFooterPreview();
                        });
                    }
                });

                // Save button
                const saveBtn = document.getElementById('saveFooterSettings');
                if (saveBtn) {
                    saveBtn.addEventListener('click', () => {
                        console.log('Save clicked - current items:', this.collectFooterItems());
                    });
                }
            }

            addFooterItem(text = '') {
                console.log('addFooterItem called with text:', text);
                
                const container = document.getElementById('footerItemsContainer');
                const emptyState = document.getElementById('footerItemsEmpty');
                
                if (!container) {
                    console.error('footerItemsContainer not found');
                    return;
                }

                // Hide empty state
                if (emptyState) {
                    emptyState.classList.add('hidden');
                }

                const itemIndex = this.itemIndex++;
                const itemHtml = `
                <div class="footer-item flex items-center gap-3 p-3 border border-gray-200 rounded-lg bg-gray-50" data-item-id="${itemIndex}">
                    <input type="text" class="footer-item-text flex-1 border border-gray-300 rounded-md px-3 py-2" placeholder="Footer tekst..." value="${text}">
                    <button type="button" class="remove-footer-item flex-shrink-0 text-red-500 hover:text-red-700 p-2">
                        <i class="fas fa-trash"></i>
                    </button>
                </div>
                `;

                container.insertAdjacentHTML('beforeend', itemHtml);

                // Add event listener to the new remove button
                const newItem = container.lastElementChild;
                const removeBtn = newItem.querySelector('.remove-footer-item');
                if (removeBtn) {
                    removeBtn.addEventListener('click', () => {
                        this.removeFooterItem(newItem);
                    });
                }

                // Add event listener to the input for live preview
                const input = newItem.querySelector('.footer-item-text');
                if (input) {
                    input.addEventListener('input', () => {
                        this.updateFooterPreview();
                    });
                }

                this.updateFooterPreview();
                console.log('Footer item added successfully');
            }

            removeFooterItem(itemElement) {
                itemElement.remove();
                this.updateFooterPreview();
                
                // Show empty state if no items left
                const container = document.getElementById('footerItemsContainer');
                const emptyState = document.getElementById('footerItemsEmpty');
                if (container && container.children.length === 0 && emptyState) {
                    emptyState.classList.remove('hidden');
                }
            }

            collectFooterItems() {
                const items = [];
                const footerItems = document.querySelectorAll('.footer-item');
                
                footerItems.forEach(item => {
                    const input = item.querySelector('.footer-item-text');
                    if (input && input.value.trim()) {
                        items.push(input.value.trim());
                    }
                });
                
                return items;
            }

            updateFooterPreview() {
                const preview = document.getElementById('footerPreview');
                if (!preview) return;

                const items = this.collectFooterItems();
                const textColor = document.getElementById('footerTextColor')?.value || '#ffffff';
                const backgroundColor = document.getElementById('footerBackgroundColor')?.value || '#000000';
                const fontSize = document.getElementById('footerFontSize')?.value || 32;

                // Apply styling
                preview.style.backgroundColor = backgroundColor;
                preview.style.color = textColor;
                preview.style.fontSize = fontSize + 'px';

                // Create content with separators
                if (items.length === 0) {
                    preview.innerHTML = '<span class="text-sm opacity-50">Geen footer items om te tonen</span>';
                } else {
                    const content = items.join(' 👑 '); // Use crown emoji as separator
                    preview.innerHTML = content;
                }
            }
        }

        // Initialize when DOM is ready
        document.addEventListener('DOMContentLoaded', () => {
            console.log('DOM loaded, initializing FooterTestManager...');
            window.testManager = new FooterTestManager();
            window.testManager.init();
            
            // Add some test data
            setTimeout(() => {
                console.log('Adding test footer item...');
                window.testManager.addFooterItem('Test footer item 1');
            }, 500);
        });
    </script>
</body>
</html>
