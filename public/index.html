<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CounterCast - Team Pinas</title>
    
    <!-- Performance: Preload critical resources -->
    <link rel="preload" href="/src/styles/MenuSignage.css" as="style" />
    <link rel="preload" href="https://use.typekit.net/iei5wpp.css" as="style" crossorigin />
    <link rel="preload" href="assets/images/team-pinas-logo.svg" as="image" />
    <link rel="preload" href="assets/images/pinas_kroon.svg" as="image" />
    
    <!-- Performance: DNS prefetch for external resources -->
    <link rel="dns-prefetch" href="https://use.typekit.net" />
    
    <link rel="stylesheet" href="/src/styles/MenuSignage.css" />
    <link rel="stylesheet" href="https://use.typekit.net/iei5wpp.css" media="print" onload="this.media='all'" />
    <!-- Performance: Load critical scripts asynchronously -->
    <script src="/config/cms-config.js" async></script>
    <script src="/src/scripts/shared/smart-logo.js" defer></script>
    <script src="/src/scripts/shared/logo-controls.js" defer></script>
    <script src="/src/scripts/shared/cms-connector.js" defer></script>
    <script src="/src/scripts/display/MenuSignage.js" defer></script>
    
    <!-- Performance monitoring (only in development) -->
    <script>
      if (window.location.hostname === 'localhost' || window.location.hostname.includes('netlify')) {
        const script = document.createElement('script');
        script.src = '/performance-monitor.js';
        script.defer = true;
        document.head.appendChild(script);
      }
    </script>
    <script>
      // Register Service Worker for performance
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js')
          .then((registration) => {
            console.log('Service Worker registered:', registration);
          })
          .catch((error) => {
            console.log('Service Worker registration failed:', error);
          });
      }
      
      // Load dynamic loading text immediately when DOM is ready
      (async function() {
        try {
          // Load version info
          const versionResponse = await fetch('/version.json');
          const versionData = await versionResponse.json();
          
          // Load settings for organization name
          let organizationName = 'Team Pinas'; // Default fallback
          try {
            const settingsResponse = await fetch('/.netlify/functions/settings');
            if (settingsResponse.ok) {
              const settingsData = await settingsResponse.json();
              organizationName = settingsData.settings?.organization_name || versionData.brandName || organizationName;
            }
          } catch (settingsError) {
            console.log('Settings not available, using version brandName or default');
            organizationName = versionData.brandName || organizationName;
          }
          
          // Update loading text when DOM is ready
          function updateLoadingText() {
            const loadingTextEl = document.getElementById('loadingText');
            if (loadingTextEl && versionData.loadingText) {
              const customLoadingText = versionData.loadingText.replace('{organisatieName}', organizationName);
              loadingTextEl.textContent = customLoadingText;
              console.log(`Loading text updated to: ${customLoadingText}`);
            } else {
              // Retry after a short delay if element not found
              setTimeout(updateLoadingText, 100);
            }
          }
          
          // Try to update immediately if DOM is already loaded
          if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', updateLoadingText);
          } else {
            updateLoadingText();
          }
          
        } catch (error) {
          console.log('Could not load dynamic loading text, keeping default');
        }
      })();
    </script>
  </head>
  <body>
    <!-- Loading Screen -->
    <div id="loadingScreen" class="loading-screen">
      <div class="loading-content">
        <img src="assets/images/pinas_kroon.svg" alt="Team Pinas" class="loading-logo">
        <div class="loading-text" id="loadingText">Team Pinas prijzen worden geladen...</div>
        <div class="loading-spinner"></div>
      </div>
    </div>

    <!-- HEADER: Logo en Clock -->
    <header class="SignageHeader">
      <div class="HeaderLogo">
        <img id="Img1" src="assets/images/team-pinas-logo.svg" alt="Team Pinas Logo" />
      </div>
      <div class="HeaderTitle">
        <span id="DayTitle"></span>
      </div>
      <div id="Clock" class="HeaderClock" aria-label="Huidige datum en tijd"></div>
    </header>

    <!-- MAIN BODY: Menu Content -->
    <main class="SignageBody">
      <div class="MenuContainer" data-columns="2">
        <!-- Category Slot 0 (hidden by default) -->
        <div class="CategorySlot" data-slot="0"></div>
        
        <!-- Category Slot 1 (left column) -->
        <div class="CategorySlot" data-slot="1"></div>
        
        <!-- Category Slot 2 (right column) -->
        <div class="CategorySlot" data-slot="2"></div>
        
        <!-- Category Slot 3 (hidden by default) -->
        <div class="CategorySlot" data-slot="3"></div>
      </div>
    </main>

    <!-- FOOTER: Scrolling Marketing Text -->
    <footer class="SignageFooter">
      <div class="ScrollingText">
        <span>
          Team Pinas - Verse maaltijden voor iedereen <img class="sep" src="assets/images/pinas_kroon.svg" alt="" role="presentation" aria-hidden="true" /> Investeer in jezelf - personal training vanaf €37,50 per les
        </span>
      </div>
    </footer>
  </body>
</html>
